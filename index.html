:root { --zikzak: 56px; --cakil-govde: #C5CFD7; --cakil-yaprak: #3F9B6E; }
@keyframes kay { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes belir { from { opacity: 0; } to { opacity: 1; } }
@keyframes yaylan { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes damga { from { background-color: var(--yuzey); } to { background-color: var(--dogru-dolgu); } }
@keyframes zipla { 0% { transform: none; } 50% { transform: translateY(-12px); } 100% { transform: none; } }
@keyframes dol { from { background-color: var(--yuzey); fill: var(--yuzey); } }
@keyframes ciz { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
@keyframes halka { from { outline: 3px solid var(--halka-renk, currentColor); outline-offset: 0; } to { outline: 3px solid transparent; outline-offset: 10px; } }
@keyframes sars { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes akis { from { width: calc(var(--onceki, 0) * 100%); } }
@keyframes ifade { from { transform: scale(.9); opacity: .5; } }
@keyframes nefes { 50% { transform: scale(1, 1.04); } }
@keyframes otur { from { transform: translateY(-14px) scale(.85); opacity: 0; } }
@keyframes otur-b { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes nabiz { 50% { transform: scale(1.08); } }
@keyframes kutla-zipla { 0%, 50%, 100% { transform: none; } 22% { transform: translateY(-22px); } 72% { transform: translateY(-10px); } }
@keyframes yerles { from { transform: translateY(-8px) scale(.6) rotate(-12deg); opacity: 0; } }
@keyframes yerles-b { from { transform: scale(1.3); opacity: 0; } }
@keyframes boy { from { transform: scaleY(0); } }
@keyframes kutla-parca { 0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(.5); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--donus, 0deg)) scale(1); } }

/* ---------- temel ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 17px; background-color: var(--zemin-sayfa); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; font-family: var(--aile-govde); font-size: 1rem; font-weight: 400; line-height: 1.5; color: var(--murekkep); background-color: var(--zemin-sayfa); overflow-wrap: anywhere; }
h1, h2, h3, p, ul, ol { margin: 0; }
ul, ol { padding: 0; }
img, svg { max-width: 100%; }
.buyuk-baslik { font-family: var(--aile-baslik); font-weight: 700; font-size: 30px; line-height: var(--buyuk-satir); }
.ara-baslik, .soru-metni { font-family: var(--aile-soru); font-weight: var(--agirlik-soru); font-size: 22px; line-height: 1.3; }
.kucuk-baslik { font-size: 1rem; font-weight: var(--agirlik-dugme); line-height: 1.5; }
.ikincil-metin { color: var(--ikincil); }
.gizli-etiket { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.balon { max-width: 36em; padding: 12px 16px; font-family: var(--aile-balon); line-height: var(--balon-satir); background-color: var(--yuzey); border: 2px solid var(--balon-cizgi); border-radius: var(--kose-alan); }
.cumleler { display: grid; gap: 12px; }
.duz-liste { list-style: none; display: grid; gap: 4px; }
.liste { list-style: none; display: grid; gap: 8px; }
.liste-satir { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 16px; background-color: var(--yuzey); border-radius: var(--kose-alan); }

.panel { display: grid; gap: 12px; padding: 20px; color: var(--murekkep); background-color: var(--yuzey); border-radius: var(--kose-kart); animation: var(--panel-anim); }
.yon-b .panel { border: 2px solid var(--murekkep); }
.panel.dogru { background-color: var(--dogru-zemin); }
.panel.dogru .panel-baslik { color: var(--dogru-yazi); }
.panel.ipucu { background-color: var(--ipucu-zemin); }
.panel.ipucu .panel-baslik { color: var(--ipucu-yazi); }
.panel-baslik { display: flex; align-items: center; gap: 8px; }
.panel-eylem { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.neden { display: grid; gap: 8px; }
.cevap-satiri { font-weight: var(--agirlik-dugme); }
.kaynak-baglanti { text-decoration: underline; }

/* ---------- alt sayfa ve onay ---------- */
.ortu { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; background-color: var(--ortu); }
.alt-sayfa { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; display: grid; gap: 16px; max-height: 85vh; overflow-y: auto; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); color: var(--murekkep); background-color: var(--yuzey); border-radius: var(--kose-kart) var(--kose-kart) 0 0; animation: var(--panel-anim); }
.yon-b .alt-sayfa { border: 2px solid var(--murekkep); }
.alt-sayfa .dugmeler .dugme { flex: 1 1 0; }
.takvim { list-style: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.takvim-gun { display: grid; justify-items: center; gap: 4px; padding: 8px 0; background-color: var(--zemin-sayfa); border-radius: var(--kose-alan); }
.takvim-gun.calisti { background-color: var(--vurgu-dolgu); }
.takvim-gun.onarim { background-color: var(--ipucu-zemin); }
.yon-b .takvim-gun { border: 2px solid var(--murekkep); }

/* ---------- E8, E9, E10 ---------- */
.tek-sutun { display: grid; gap: 16px; align-content: start; max-width: 640px; padding-top: 12px; padding-bottom: 100px; }
.sozluk { display: grid; gap: 16px; padding: 12px 20px 32px; }
.arama { width: 100%; min-height: 48px; padding: 0 16px; font: inherit; color: var(--murekkep); background-color: var(--yuzey); border: 2px solid var(--cizgi); border-radius: var(--kose-alan); }
.sozluk-govde { display: grid; gap: 16px; }
.sozluk-liste { display: grid; gap: 8px; align-content: start; }
.sozluk-satirlari { list-style: none; display: grid; gap: 8px; }
.harf { padding-top: 16px; }
.sozluk-satir { display: grid; gap: 2px; width: 100%; min-height: 64px; padding: 8px 16px; text-align: left; background-color: var(--yuzey); border-radius: var(--kose-alan); }
.yon-b .sozluk-satir { border: 2px solid var(--murekkep); }
.sozluk-satir.secili { background-color: var(--secili-dolgu); }
.sozluk-tr { font-weight: var(--agirlik-dugme); }
.terim-ayrinti { display: grid; gap: 8px; max-width: 640px; padding: 16px; }
.sozluk-ayrinti { display: none; }
.ayarlar { display: grid; gap: 32px; max-width: 640px; padding: 12px 20px 48px; }
.ayar-bolum { display: grid; gap: 12px; }
.secim-grup { display: flex; flex-wrap: wrap; gap: 8px; }
.anahtar-satir { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; padding: 0 16px; background-color: var(--yuzey); border: 2px solid var(--cizgi); border-radius: var(--kose-alan); }
.anahtar-sag { display: flex; align-items: center; gap: 12px; }
.anahtar { position: relative; display: block; width: 52px; height: 32px; background-color: var(--yuzey); border: 2px solid var(--cizgi); border-radius: var(--kose-dugme); transition: background-color var(--sure-secme) var(--egri-secme); }
.anahtar::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; background-color: var(--cizgi); border-radius: var(--kose-dugme); transition: transform var(--sure-secme) var(--egri-secme); }
.anahtar-satir[aria-checked="true"] .anahtar { background-color: var(--eylem); border-color: var(--eylem); }
.anahtar-satir[aria-checked="true"] .anahtar::after { background-color: var(--yuzey); transform: translateX(20px); }
.kod-alani { width: 100%; min-height: 120px; padding: 12px; font: inherit; color: var(--murekkep); background-color: var(--yuzey); border: 2px solid var(--cizgi); border-radius: var(--kose-alan); overflow-wrap: anywhere; resize: vertical; }
.aktarim-mesaj { font-weight: var(--agirlik-dugme); }

/* ---------- E11 işaretler ve kazanma bildirimi (TASARIM bölüm 10) ---------- */
.basari-liste { list-style: none; display: grid; gap: 8px; }
.basari-satir { display: flex; align-items: flex-start; gap: 16px; min-height: 88px; padding: 12px 16px; background-color: var(--yuzey); border-radius: var(--kose-alan); }
.yon-b .basari-satir { border: 2px solid var(--murekkep); }
.basari-resim { display: block; flex: none; width: 64px; height: 64px; }
.basari-metin { display: grid; gap: 2px; min-width: 0; }
.basari-ad { font-weight: var(--agirlik-dugme); }
.basari-durum { display: flex; align-items: center; gap: 4px; color: var(--ikincil); }
.basari-uyari { display: flex; flex-wrap: wrap; align-items: center; gap: 0 12px; flex: 1 1 auto; min-width: 0; }
.basari-uyari .bildirim-metin { flex: 1 1 160px; min-width: 0; }
.basari-mini { display: block; flex: none; width: 40px; height: 40px; animation: var(--basari-anim); }
.basari-uyari .dugmeler { gap: 4px; }

/* ---------- E12 son yedi gün (TASARIM bölüm 11): yedi sütunlu iki grafik ve zorlanılan dersler ---------- */
.hafta-dugme { padding: 0; }
.hafta-kart { display: grid; gap: 12px; padding: 16px 12px; background-color: var(--yuzey); border-radius: var(--kose-alan); }
.yon-b .hafta-kart { border: 2px solid var(--murekkep); }
.hafta-grafik { list-style: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.hafta-gun { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.hafta-deger, .hafta-ad { min-height: 1.5em; text-align: center; white-space: nowrap; }
.hafta-gun.veri-yok .hafta-deger { color: var(--ikincil); }
.hafta-sutun { position: relative; display: flex; align-items: flex-end; justify-content: center; width: 100%; height: 120px; border-bottom: 2px solid var(--cizgi); }
.hafta-gun.veri-yok .hafta-sutun { border-bottom-style: dashed; }
.hafta-dakika .hafta-sutun::after { content: ""; position: absolute; left: 0; right: 0; bottom: calc(var(--hedef, 0) * 100%); border-top: 2px dashed var(--murekkep); }
.hafta-cubuk { display: block; width: 60%; max-width: 32px; height: calc(var(--oran, 0) * 100%); background-color: var(--ilerleme-dolu); transform-origin: 50% 100%; animation: var(--hafta-anim); }
.hafta-dogru .hafta-cubuk { background-color: var(--dogru-yazi); }
.yon-a .hafta-cubuk { border-radius: 8px 8px 0 0; }
.yon-b .hafta-cubuk { border: 2px solid var(--murekkep); border-bottom: 0; }
.hafta-zor { display: grid; gap: 12px; }
.hafta-liste { list-style: none; display: grid; gap: 8px; }
.hafta-satir { display: grid; gap: 2px; padding: 12px 16px; background-color: var(--yuzey); border-radius: var(--kose-alan); }
.yon-b .hafta-satir { border: 2px solid var(--murekkep); }
.hafta-ders { font-weight: var(--agirlik-dugme); }
.hafta-yeniden { justify-self: start; margin-left: -8px; }

/* ---------- ses ve hareket (TASARIM bölüm 8; M ve K numaraları oradaki tablolar) ---------- */
/* M1 ekran, kart ve soru geçişi: yalnız saydamlık (transform sabit eylem çubuğunu kaydırırdı). */
.ekran, .kart, .soru-govde { animation: var(--gecis-anim); }
/* M2-M5 cevap anı: .anlik-dogru ve .anlik-yanlis "Kontrol et" çiziminde bir kez gelir. */
.anlik-dogru .secenek.dogru, .anlik-dogru .dy-dugme.dogru, .anlik-dogru .bosluk-kutu.dogru { --halka-renk: var(--dogru-cizgi); animation: var(--dogru-anim), var(--parla-anim); }
.anlik-dogru .eslestir-oge, .anlik-dogru .sirala-oge.yerde { --halka-renk: var(--dogru-cizgi); animation: var(--parla-anim); }
.anlik-dogru .dogru .secenek-simge path, .simge.ciz path { stroke-dasharray: 20; animation: var(--ciz-anim); }
.anlik-yanlis .yanlis-secim, .anlik-yanlis .eslestir, .anlik-yanlis .sirala-liste { animation: var(--sars-anim); }
/* M6 ilerleme çubuğu önceki orandan (--onceki) akar. */
.cubuk-dolu.akar { animation: var(--akis-anim); }
/* K2-K3 kutlama: Çakıl zıplar, taş ve yaprak parçacıkları Çakıl'ın arkasından saçılır (renkler Çakıl'ın kendi renkleri). */
.kutlama { position: relative; }
.kutlama .cakil { position: relative; z-index: 1; }
.cakil.kutla-zipla { animation: var(--kutla-zipla-anim); }
.parca { position: absolute; left: 50%; top: 45%; width: var(--boy, 10px); height: var(--boy, 10px); margin: calc(var(--boy, 10px) / -2) 0 0 calc(var(--boy, 10px) / -2); border: 2px solid var(--murekkep); opacity: 0; pointer-events: none; animation: var(--kutla-parca-anim); }
.tas-parca { background-color: var(--cakil-govde); border-radius: 48% 52% 46% 54% / 54% 46% 52% 48%; }
.yaprak-parca { background-color: var(--cakil-yaprak); border-radius: 0 100% 0 100%; }
.yon-b .tas-parca { border-radius: 0; }
/* M7-M9 Çakıl: ifade geçişi, nefes (göz kırpma JS'te, resim değişimiyle). Kutlamadan sonra gelir ki onu ezsin. */
.cakil.ifade-gecis { animation: var(--ifade-anim); }
.cakil.nefes { transform-origin: 50% 100%; animation: var(--nefes-anim); }
/* M10-M12 yol: yeni açılan taş oturur, etkin taş nabız atar, birimi biten bant parlar. */
.tas.yeni-acik { animation: var(--otur-anim); }
.tas.nabiz { animation: var(--nabiz-anim); }
.birim-bant.parla { --halka-renk: var(--eylem); animation: var(--bant-anim); }

/* ---------- laptop: 1024 px ve üstü (TASARIM bölüm 3) ---------- */
@media (min-width: 1024px) {
  :root { --zikzak: 96px; }
  html { font-size: 18px; }
  .buyuk-baslik { font-size: var(--buyuk-boy-lap); }
  .ara-baslik, .soru-metni { font-size: var(--soru-boy-lap); }
  .odak-ust { min-height: 64px; padding: 0 32px; }
  .odak-govde { grid-template-columns: minmax(0, 320fr) minmax(0, 720fr); column-gap: 48px; row-gap: 24px; width: min(1088px, calc(100% - 64px)); max-width: none; padding: 32px 0 48px; }
  .odak-govde.sonuc { padding-top: 96px; }
  .odak-sag > p, .kart, .panel p, .cumleler p { max-width: 36em; }
  .cakil-buyuk { width: 240px; height: 240px; }
  .eylem-cubugu { position: static; justify-content: flex-end; padding: 0; background-color: transparent; }
  .yon-b .eylem-cubugu { border-top: 0; }
  .eylem-cubugu .dugme { flex: 0 0 auto; width: 240px; }
  .sonuc-dugmeler { grid-template-columns: repeat(2, minmax(0, 280px)); }
  .yon-b .soru-bant { margin: 0; padding: 24px; }
  .tus-cip { display: inline-flex; }
  .dy-dugmeler { grid-template-columns: repeat(2, minmax(0, 300px)); }
  .eslestir { grid-template-columns: repeat(2, minmax(0, 340px)); }
  .panel { animation: var(--belir-anim); }
  .panel-cakil { display: none; }
  .panel-eylem .dugme { width: 240px; }
  .panel-acik .eylem-cubugu { display: none; }
  .acilis { display: grid; grid-template-columns: minmax(0, 320fr) minmax(0, 720fr); column-gap: 48px; align-content: start; width: min(1088px, calc(100% - 64px)); max-width: none; min-height: 0; padding: 160px 0 48px; }
  .acilis-sol { flex-direction: column; }
  .acilis-sol .cakil-buyuk { width: 240px; height: 240px; }
  .acilis-dugmeler { grid-template-columns: repeat(2, minmax(0, 280px)); margin-top: 16px; }
  .gezinme { top: 0; right: auto; width: 240px; flex-direction: column; padding: 32px 0; }
  .yon-b .gezinme { border-top: 0; border-right: 2px solid var(--murekkep); }
  .gezinme-oge { flex: 0 0 auto; flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 56px; padding: 0 24px; }
  .gezinme-oge[aria-current="page"] .gezinme-isaret { top: 4px; bottom: 4px; left: 8px; width: auto; height: auto; right: 8px; margin-left: 0; }
  html[data-duzen="gezinmeli"] #ekranlar { padding-left: 240px; padding-bottom: 0; }
  html[data-duzen="gezinmeli"] .bildirim { margin-left: 240px; }
  html[data-duzen="gezinmeli"] .eylem-cubugu { justify-content: flex-start; }
  #e3:not([hidden]) { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; }
  .orta { padding: 0 32px 48px; }
  .yon-b .yol { max-width: 560px; }
  .sag-panel { position: sticky; top: 0; display: grid; gap: 16px; padding: 32px; }
  .tek-sutun { padding-bottom: 48px; }
  .hafta-sutun { height: 160px; }
  .sozluk { padding: 24px 32px 48px; }
  .sozluk > .ara-baslik, .sozluk > .arama { max-width: 376px; }
  .sozluk-govde { grid-template-columns: minmax(0, 376fr) minmax(0, 760fr); column-gap: 32px; align-items: start; }
  .sozluk-ayrinti { position: sticky; top: 0; display: block; padding: 0 16px; }
  .ayarlar { width: min(640px, calc(100% - 96px)); margin-left: 48px; padding: 32px 0 48px; }
  .alt-sayfa { top: 0; right: 0; bottom: 0; left: 0; width: min(480px, calc(100% - 64px)); height: max-content; margin: auto; border-radius: var(--kose-kart); animation: var(--belir-anim); }
}

/* ---------- telefon: 1023 px ve altı ---------- */
@media (max-width: 1023.98px) {
  #e4 .odak-sol, #e5 .odak-sol, #e2 .odak-govde:not(.sonuc) .odak-sol { display: none; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 75vh; overflow-y: auto; padding-bottom: calc(20px + env(safe-area-inset-bottom)); border-radius: var(--kose-kart) var(--kose-kart) 0 0; }
  .panel-eylem .dugme { flex: 1 1 100%; }
  .panel-acik .eylem-cubugu { display: none; }
}
